name: royal-road-trace-federator

# Tests and builds royal-road/trace-federator, the Tempo-API federator behind
# the distributed-tracing console plugin.

on:
  push:
    branches: [main]
    paths:
      - royal-road/trace-federator/**
      - .github/workflows/royal-road-trace-federator.yml
  pull_request:
    paths:
      - royal-road/trace-federator/**
      - .github/workflows/royal-road-trace-federator.yml
  workflow_dispatch:

concurrency:
  group: royal-road-trace-federator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trace-federator

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: royal-road/trace-federator/go.mod
          cache: false

      - name: Test
        working-directory: royal-road/trace-federator
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Version
        id: version
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: royal-road/trace-federator
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=trace-federator
          cache-to: type=gha,mode=max,scope=trace-federator
