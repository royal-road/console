name: royal-road-alert-renderer

# Tests and builds royal-road/alert-renderer, the Alertmanager webhook
# receiver that posts Discord messages with a chart of the rule.

on:
  push:
    branches: [main]
    paths:
      - royal-road/alert-renderer/**
      - .github/workflows/royal-road-alert-renderer.yml
  pull_request:
    paths:
      - royal-road/alert-renderer/**
      - .github/workflows/royal-road-alert-renderer.yml
  workflow_dispatch:

concurrency:
  group: royal-road-alert-renderer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alert-renderer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: royal-road/alert-renderer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install 1.100 --profile minimal -c rustfmt,clippy
          rustup default 1.100

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          dev/e2e.sh target/debug/alert-renderer

      - name: Audit
        # RUSTSEC-2026-0192: ttf-parser (via ab_glyph) is unmaintained; it only
        # parses the font compiled into the binary.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0192

      - name: Version
        id: version
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: royal-road/alert-renderer
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=alert-renderer
          cache-to: type=gha,mode=max,scope=alert-renderer
