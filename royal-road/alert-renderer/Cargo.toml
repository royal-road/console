[package]
name = "alert-renderer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Alertmanager webhook receiver that posts readable Discord messages with a chart of the rule"

[dependencies]
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
tiny_http = { version = "0.12", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwind, not abort: a rendering bug is caught and the text still goes out.
panic = "unwind"
opt-level = 3
