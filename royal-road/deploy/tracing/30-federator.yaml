# trace-federator: Tempo HTTP API over the configured stores, and the
# distributed-tracing plugin's backend API. The bridge reaches it through
# BRIDGE_PLUGIN_PROXY with authorize: true (README.md).
#
# Secret trace-federator-credentials (create it yourself, never commit it):
#   sentry-token     Sentry API token with org:read project:read event:read
#   signoz-api-key   SigNoz service-account API key (Viewer)
#
# Replace <sha> with the image tag CI pushed (short commit SHA of main).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-federator
  namespace: tracing
  labels:
    app.kubernetes.io/name: trace-federator
    app.kubernetes.io/part-of: tracing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-federator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-federator
        app.kubernetes.io/part-of: tracing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: trace-federator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trace-federator
          image: ghcr.io/royal-road/trace-federator:<sha>
          args: [-config, /etc/trace-federator/config.json]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/trace-federator/config.json
              subPath: config.json
            - name: credentials
              mountPath: /etc/trace-federator/credentials
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: trace-federator
        - name: credentials
          secret:
            secretName: trace-federator-credentials
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: trace-federator
  namespace: tracing
  labels:
    app.kubernetes.io/name: trace-federator
spec:
  selector:
    app.kubernetes.io/name: trace-federator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trace-federator
  namespace: tracing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-federator
