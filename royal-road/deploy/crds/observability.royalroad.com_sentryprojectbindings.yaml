# SentryProjectBinding links a Sentry project (optionally only some of its
# environments) to Kubernetes namespaces and/or workloads. It is Royal Road's
# own CRD, not an OpenShift one; see README.md in this directory.
#
# Cluster-scoped: no aggregated ClusterRole grants it, so only cluster-admins
# can create, change or read bindings directly. Consumers:
#   - trace-federator: a viewer sees Sentry spans of a bound project only if
#     they can `get` one of the binding's targets (the workload, or pods in the
#     namespace for namespace-wide targets); cluster-admins see every bound
#     project. Unbound projects are never shown.
#   - sentry-plugin (royal-road/console-plugins, plugins/sentry): the Sentry tab
#     on workloads reads a workload's projects from its bindings, and its
#     backend writes bindings on users' behalf: a user who may patch a
#     workload may link it to projects already bound to its namespace.
# Consumers need their own ClusterRole (trace-federator's is in
# royal-road/deploy/tracing/). Never add aggregate-to-admin/edit/view labels
# to a role for this CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentryprojectbindings.observability.royalroad.com
  annotations:
    royalroad.com/docs: https://github.com/royal-road/console/blob/main/royal-road/deploy/crds/README.md#sentryprojectbinding
spec:
  group: observability.royalroad.com
  scope: Cluster
  names:
    kind: SentryProjectBinding
    listKind: SentryProjectBindingList
    plural: sentryprojectbindings
    singular: sentryprojectbinding
    shortNames: [spb]
    categories: [observability]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Organization
          type: string
          jsonPath: .spec.sentry.organization
        - name: Project
          type: string
          jsonPath: .spec.sentry.project
        - name: Environments
          type: string
          jsonPath: .spec.sentry.environments
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [sentry, targets]
              properties:
                sentry:
                  description: The Sentry project the targets report to.
                  type: object
                  required: [organization, project]
                  properties:
                    organization:
                      description: Organization slug.
                      type: string
                      minLength: 1
                      maxLength: 64
                    project:
                      description: Project slug.
                      type: string
                      minLength: 1
                      maxLength: 100
                    environments:
                      description: >-
                        Sentry environments the binding covers. Empty or
                        absent means all environments of the project.
                      type: array
                      maxItems: 32
                      items:
                        type: string
                        minLength: 1
                        maxLength: 64
                      x-kubernetes-list-type: set
                targets:
                  description: >-
                    Namespaces or workloads whose viewers may see this
                    project's data. A target with only a namespace covers the
                    whole namespace; with kind and name it covers one workload.
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: object
                    required: [namespace]
                    properties:
                      namespace:
                        type: string
                        minLength: 1
                        maxLength: 63
                      kind:
                        type: string
                        enum: [Deployment, StatefulSet, DaemonSet, CronJob, Job]
                      name:
                        type: string
                        minLength: 1
                        maxLength: 253
                    x-kubernetes-validations:
                      - rule: has(self.kind) == has(self.name)
                        message: kind and name must be set together
